<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViewTube</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0e0f11; --surface:#17181b; --surface2:#1f2023; --surface3:#292a2e;
  --accent:#ff7a45; --accent-dim:#3a2419;
  --live:#ff3b4e;
  --text:#eeeeef; --text2:#9a9ea5; --text3:#5c5f66;
  --border:rgba(255,255,255,.08);
  --sidebar-w:236px; --header-h:64px;
  --f-display:'Sora',sans-serif; --f-body:'Inter',sans-serif;
  --r:10px; --r-sm:6px; --r-pill:999px;
}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow-x:hidden;}
button,input{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* HEADER */
header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:18px;z-index:100;}
.hamburger{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:var(--r-sm);}
.hamburger:hover{background:var(--surface);}
.hamburger span{width:19px;height:2px;background:var(--text2);border-radius:2px;display:block;}
.logo{font-family:var(--f-display);font-size:21px;font-weight:800;display:flex;align-items:center;gap:9px;white-space:nowrap;letter-spacing:-.02em;}
.logo-icon{width:30px;height:30px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-icon svg{width:15px;height:15px;fill:#0e0f11;}
.search-bar{flex:1;max-width:600px;margin:0 auto;display:flex;position:relative;}
.search-bar input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:0 46px 0 18px;height:40px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s,background .15s;}
.search-bar input:focus{border-color:var(--accent);background:var(--surface2);}
.search-bar input::placeholder{color:var(--text3);}
.search-btn{position:absolute;right:4px;top:4px;bottom:4px;width:32px;background:var(--surface3);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);}
.search-btn:hover{color:var(--text);}
.search-btn svg{width:15px;height:15px;}
.header-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
.icon-btn{width:38px;height:38px;background:none;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);position:relative;}
.icon-btn:hover{background:var(--surface);color:var(--text);}
.icon-btn svg{width:19px;height:19px;}
.sign-in-btn{padding:0 16px;height:36px;background:transparent;border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;}
.sign-in-btn:hover{background:var(--surface);}
.sign-in-btn svg{width:15px;height:15px;}

/* SIDEBAR */
.sidebar{position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--sidebar-w);background:var(--bg);border-right:1px solid var(--border);overflow-y:auto;padding:14px 0;z-index:50;transition:transform .2s ease,width .2s ease;}
.sidebar.collapsed{width:76px;}
.nav-label{padding:16px 20px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text3);white-space:nowrap;overflow:hidden;}
.sidebar.collapsed .nav-label{opacity:0;}
.nav-item{display:flex;align-items:center;gap:15px;padding:10px 20px;color:var(--text2);cursor:pointer;white-space:nowrap;overflow:hidden;font-size:14px;position:relative;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--surface);color:var(--text);}
.nav-item.active{background:var(--surface);color:var(--text);font-weight:600;}
.nav-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--accent);border-radius:0 3px 3px 0;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.sidebar.collapsed .nav-item span{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px;}
.live-dot{width:7px;height:7px;background:var(--live);border-radius:50%;margin-left:auto;flex-shrink:0;animation:pulse 2s infinite;}
.sidebar.collapsed .live-dot{display:none;}

/* MAIN */
.main{margin-top:var(--header-h);margin-left:var(--sidebar-w);transition:margin-left .2s ease;min-height:calc(100vh - var(--header-h));}
.main.sidebar-collapsed{margin-left:76px;}
.filter-bar{position:sticky;top:var(--header-h);background:var(--bg);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;gap:8px;overflow-x:auto;z-index:40;}
.filter-bar::-webkit-scrollbar{display:none;}
.chip{padding:7px 16px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border);color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;}
.chip:hover{background:var(--surface3);color:var(--text);}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.content{padding:26px 24px;}
.section-title{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0 0 16px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em;}
.section-title .live-dot-title{width:8px;height:8px;background:var(--live);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.section-sub{color:var(--text2);font-size:13px;margin:-10px 0 16px;}
.view-more{margin-left:auto;font-size:13px;color:var(--text2);cursor:pointer;font-weight:500;}
.view-more:hover{color:var(--text);}

/* VIDEO GRID */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px 18px;margin-bottom:44px;}
.video-grid.large{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));}
.video-card{cursor:pointer;}
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--surface);}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease;}
.video-card:hover .thumb img{transform:scale(1.045);}
.thumb-overlay{position:absolute;inset:0;background:rgba(0,0,0,.25);opacity:0;display:flex;align-items:center;justify-content:center;transition:opacity .15s;}
.video-card:hover .thumb-overlay{opacity:1;}
.play-btn-big{width:46px;height:46px;background:rgba(0,0,0,.65);border:2px solid rgba(255,255,255,.85);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.play-btn-big svg{width:17px;height:17px;fill:#fff;margin-left:2px;}
.duration-badge{position:absolute;bottom:7px;right:7px;background:rgba(0,0,0,.82);color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;}
.live-badge{position:absolute;top:7px;left:7px;background:var(--live);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;letter-spacing:.04em;display:flex;align-items:center;gap:5px;}
.live-badge::before{content:'';width:5px;height:5px;background:#fff;border-radius:50%;animation:pulse 1.4s infinite;}
.video-meta{padding:11px 0 0;display:flex;gap:10px;}
.channel-pic{width:34px;height:34px;border-radius:50%;flex-shrink:0;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-display);}
.meta-text{flex:1;min-width:0;}
.video-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.35;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--f-display);}
.video-channel{font-size:12.5px;color:var(--text2);margin-bottom:1px;}
.video-stats{font-size:12px;color:var(--text3);}
.empty-note{color:var(--text3);font-size:13px;padding:8px 0 30px;}

/* SHORTS RAIL (home) */
.shorts-rail{display:flex;gap:14px;overflow-x:auto;margin-bottom:44px;padding-bottom:4px;}
.short-card{cursor:pointer;flex:0 0 168px;}
.short-thumb{aspect-ratio:9/16;background:var(--surface);border-radius:var(--r);overflow:hidden;position:relative;}
.short-thumb img{width:100%;height:100%;object-fit:cover;}
.short-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;}
.short-title{padding:8px 2px 0;font-size:13px;font-weight:600;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--f-display);}
.short-views{font-size:11.5px;color:var(--text3);padding:2px 2px 0;}

/* SHORTS FULL FEED */
.shorts-feed{position:fixed;top:var(--header-h);left:var(--sidebar-w);right:0;bottom:0;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000;transition:left .2s ease;z-index:30;display:none;}
.shorts-feed.active{display:block;}
.main.sidebar-collapsed ~ .shorts-feed{left:76px;}
.short-slide{height:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;position:relative;}
.short-player-wrap{width:min(420px,92vw);height:min(100%,860px);background:#000;border-radius:14px;overflow:hidden;position:relative;}
.short-player-wrap iframe{width:100%;height:100%;border:none;pointer-events:none;}
.short-info{position:absolute;bottom:18px;left:18px;right:70px;color:#fff;}
.short-info .st{font-family:var(--f-display);font-weight:700;font-size:15px;margin-bottom:6px;line-height:1.3;}
.short-info .sc{font-size:13px;color:rgba(255,255,255,.75);}
.short-side-actions{position:absolute;right:14px;bottom:24px;display:flex;flex-direction:column;gap:18px;align-items:center;}
.short-side-actions button{background:rgba(255,255,255,.12);border:none;width:46px;height:46px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.short-side-actions svg{width:22px;height:22px;}
.shorts-feed-empty{color:var(--text2);display:flex;align-items:center;justify-content:center;height:100%;font-size:14px;}

/* PLAYER MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;}
.modal-overlay.open{display:flex;}
.modal-inner{display:flex;width:100%;height:100%;overflow-y:auto;}
.player-side{flex:1;min-width:0;padding:22px;display:flex;flex-direction:column;max-width:calc(100% - 380px);}
.player-video{width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;position:relative;}
.player-video iframe{width:100%;height:100%;border:none;}
.player-info{padding:16px 0;}
.player-title{font-family:var(--f-display);font-size:19px;font-weight:700;margin-bottom:10px;line-height:1.3;}
.player-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.player-channel-row{display:flex;align-items:center;gap:10px;flex:1;}
.player-channel-name{font-size:14px;font-weight:600;}
.player-subs{font-size:12px;color:var(--text3);}
.sub-btn{padding:9px 18px;background:var(--accent);color:#1a0e07;border:none;border-radius:var(--r-pill);font-size:13px;font-weight:700;cursor:pointer;}
.sub-btn.subscribed{background:var(--surface3);color:var(--text);}
.action-btns{display:flex;gap:8px;flex-wrap:wrap;}
.action-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text2);font-size:13px;cursor:pointer;}
.action-btn:hover{background:var(--surface3);color:var(--text);}
.action-btn svg{width:16px;height:16px;}
.action-btn.liked{color:var(--accent);border-color:var(--accent);}
.player-stats{font-size:13px;color:var(--text3);margin-top:10px;}
.desc-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-top:14px;font-size:13px;color:var(--text2);line-height:1.6;max-height:120px;overflow-y:auto;white-space:pre-wrap;}
.autoplay-row{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border-radius:var(--r);margin-bottom:14px;font-size:13px;font-weight:600;}
.switch{width:38px;height:22px;background:var(--surface3);border-radius:var(--r-pill);position:relative;cursor:pointer;flex-shrink:0;margin-left:auto;transition:background .15s;}
.switch.on{background:var(--accent);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s;}
.switch.on::after{transform:translateX(16px);}
.up-next-side{width:380px;flex-shrink:0;padding:22px 22px 22px 0;overflow-y:auto;border-left:1px solid var(--border);}
.up-next-title{font-family:var(--f-display);font-size:15px;font-weight:700;margin-bottom:14px;padding-left:16px;}
.up-next-card{display:flex;gap:10px;padding:10px 16px;cursor:pointer;border-radius:var(--r-sm);}
.up-next-card:hover{background:var(--surface);}
.up-next-card.playing{background:var(--surface2);}
.up-next-thumb{width:118px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--surface3);position:relative;}
.up-next-thumb img{width:100%;height:100%;object-fit:cover;}
.up-next-meta{flex:1;min-width:0;}
.up-next-title-text{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--f-display);margin-bottom:4px;}
.up-next-channel{font-size:12px;color:var(--text2);}
.up-next-stats{font-size:12px;color:var(--text3);}
.modal-close{position:fixed;top:16px;right:16px;z-index:210;width:38px;height:38px;background:var(--surface2);border:1px solid var(--border);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);}
.modal-close:hover{background:var(--surface3);color:var(--text);}
.modal-close svg{width:17px;height:17px;}

/* RESULTS LIST / HISTORY */
.result-row{display:flex;gap:16px;padding:12px 8px;cursor:pointer;border-radius:var(--r-sm);}
.result-row:hover{background:var(--surface);}
.result-thumb{width:240px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--surface);position:relative;}
.result-thumb img{width:100%;height:100%;object-fit:cover;}
.result-meta{flex:1;min-width:0;}
.result-title{font-family:var(--f-display);font-size:16.5px;font-weight:700;margin-bottom:6px;line-height:1.3;}
.result-stats{font-size:13px;color:var(--text3);margin-bottom:8px;}
.result-desc{font-size:13px;color:var(--text2);line-height:1.5;}
.result-channel-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.history-header{display:flex;align-items:center;margin-bottom:18px;}
.clear-history-btn{margin-left:auto;padding:8px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text2);font-size:13px;cursor:pointer;}
.clear-history-btn:hover{background:var(--surface3);color:var(--text);}

.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface3) 50%,var(--surface) 75%);background-size:600px 100%;animation:shimmer 1.4s infinite linear;border-radius:var(--r-sm);}
@keyframes shimmer{0%{background-position:-600px 0;}100%{background-position:600px 0;}}
.view{display:none;}
.view.active{display:block;}

@media (max-width:900px){
  .sidebar{display:none;} .main{margin-left:0!important;} .up-next-side{display:none;}
  .player-side{max-width:100%;} .shorts-feed{left:0!important;}
}
@media (max-width:600px){
  .result-thumb{width:130px;} .result-title{font-size:14px;}
}
</style>
</head>
<body>

<header>
  <button class="hamburger" id="hamburgerBtn" title="Toggle sidebar"><span></span><span></span><span></span></button>
  <a href="#" class="logo" id="logoLink">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    ViewTube
  </a>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search videos, channels, topics…" autocomplete="off">
    <button class="search-btn" id="searchBtn" title="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </div>
  <div class="header-actions">
    <button class="icon-btn" title="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <button class="sign-in-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Sign in</button>
  </div>
</header>

<nav class="sidebar" id="sidebar">
  <button class="nav-item active" data-view="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></button>
  <button class="nav-item" data-view="shorts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg><span>Shorts</span></button>
  <button class="nav-item" data-view="live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg><span>Live</span><span class="live-dot"></span></button>
  <button class="nav-item" data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>History</span></button>
  <div class="nav-label">Explore</div>
  <button class="nav-item chip-nav" data-cat="Gaming"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span>Gaming</span></button>
  <button class="nav-item chip-nav" data-cat="Music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Music</span></button>
  <button class="nav-item chip-nav" data-cat="Science &amp; Tech"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg><span>Tech</span></button>
</nav>

<main class="main" id="main">
  <div class="filter-bar" id="filterBar">
    <button class="chip active" data-cat="All">All</button>
    <button class="chip" data-cat="Gaming">Gaming</button>
    <button class="chip" data-cat="Music">Music</button>
    <button class="chip" data-cat="Technology">Technology</button>
    <button class="chip" data-cat="Science">Science</button>
    <button class="chip" data-cat="Sports">Sports</button>
    <button class="chip" data-cat="Cooking">Cooking</button>
    <button class="chip" data-cat="Travel">Travel</button>
    <button class="chip" data-cat="News">News</button>
    <button class="chip" data-cat="Comedy">Comedy</button>
    <button class="chip" data-cat="Education">Education</button>
  </div>

  <div class="content">
    <div class="view active" id="view-home">
      <div class="section-title"><span class="live-dot-title"></span>Live Now</div>
      <div class="video-grid" id="liveGrid"><div class="empty-note">Loading live streams…</div></div>

      <div class="section-title">⚡ Shorts</div>
      <div class="shorts-rail" id="shortsRail"><div class="empty-note">Loading shorts…</div></div>

      <div class="section-title" id="recTitle">Recommended for you</div>
      <div class="section-sub" id="recSub">Watch a few videos and this fills in based on what you like.</div>
      <div class="video-grid" id="recGrid"><div class="empty-note">Loading…</div></div>

      <div class="section-title">🔥 Trending</div>
      <div class="video-grid large" id="trendGrid"><div class="empty-note">Loading trending…</div></div>
    </div>

    <div class="view" id="view-search">
      <div class="section-title" id="searchTitle">Search results</div>
      <div id="searchList"></div>
    </div>

    <div class="view" id="view-live">
      <div class="section-title"><span class="live-dot-title"></span>Live Now</div>
      <div class="video-grid" id="liveGridFull"><div class="empty-note">Loading live streams…</div></div>
    </div>

    <div class="view" id="view-history">
      <div class="history-header">
        <div class="section-title" style="margin:0;">Watch history</div>
        <button class="clear-history-btn" id="clearHistoryBtn">Clear history</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>
</main>

<div class="shorts-feed" id="shortsFeed"></div>

<div class="modal-overlay" id="modal">

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const YT_KEY = 'AIzaSyAwn5YtNsE0P_1Ch_t6iaizGBs8aU_Doys';
const API = 'https://www.googleapis.com/youtube/v3';
const AVATAR_COLORS = ['#ff7a45','#4dd0e1','#9b8cff','#ffd166','#06d6a0','#f77f6c','#7cb8ff'];
const catQuery = c => ({All:'trending',Gaming:'gaming highlights',Music:'music',Technology:'tech review',Science:'science explained',Sports:'sports highlights',Cooking:'cooking recipe','Science & Tech':'technology'}[c] || c);

let sidebarCollapsed=false, activeCategory='All', autoplayOn=true, ytPlayer=null, upNextQueue=[], currentVideoId=null, isSubscribed=false, isLiked=false;

/* ---------- history + recommendations ---------- */
function getHistory(){ try{ return JSON.parse(localStorage.getItem('vt_history')||'[]'); }catch(e){ return []; } }
function saveHistory(list){ localStorage.setItem('vt_history', JSON.stringify(list.slice(0,200))); }
function pushHistory(video, topic){
  const h = getHistory();
  h.unshift({...video, topic, watchedAt: Date.now()});
  saveHistory(h);
}
function topTopic(){
  const h = getHistory();
  if(!h.length) return null;
  const counts = {};
  h.forEach(v => { counts[v.topic] = (counts[v.topic]||0) + 1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
}

/* ---------- helpers ---------- */
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtViews(n){ n=parseInt(n||0); if(n>=1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'')+'M'; if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'K'; return String(n); }
function timeAgo(d){ if(!d) return ''; const diff=Date.now()-new Date(d).getTime(); const m=Math.floor(diff/60000),h=Math.floor(m/60),dy=Math.floor(h/24),w=Math.floor(dy/7),mo=Math.floor(dy/30),y=Math.floor(dy/365);
  if(y>0) return y+' year'+(y>1?'s':'')+' ago'; if(mo>0) return mo+' month'+(mo>1?'s':'')+' ago'; if(w>0) return w+' week'+(w>1?'s':'')+' ago'; if(dy>0) return dy+' day'+(dy>1?'s':'')+' ago'; if(h>0) return h+' hour'+(h>1?'s':'')+' ago'; return m+' minute'+(m>1?'s':'')+' ago'; }
function parseDur(iso){ if(!iso) return ''; const m=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); if(!m) return ''; const h=+m[1]||0,mi=+m[2]||0,s=+m[3]||0; return h>0?`${h}:${String(mi).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${mi}:${String(s).padStart(2,'0')}`; }
function durSeconds(iso){ if(!iso) return 0; const m=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); if(!m) return 0; return (+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0); }
function avatarColor(name){ let s=0; for(const c of (name||'?')) s+=c.charCodeAt(0); return AVATAR_COLORS[s%AVATAR_COLORS.length]; }

async function ytFetch(path, params){
  const url = `${API}/${path}?${new URLSearchParams({...params, key: YT_KEY}).toString()}`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data;
}

/* fetch a batch of normalized videos for a query / mode */
async function fetchVideos({q, chart, eventType, videoDuration, max=12, topic}){
  let items = [];
  if(chart){
    const d = await ytFetch('videos', {part:'snippet,statistics,contentDetails', chart:'mostPopular', regionCode:'US', maxResults:max});
    items = d.items.map(v => ({ id:v.id, snippet:v.snippet, statistics:v.statistics, contentDetails:v.contentDetails }));
  } else {
    const s = await ytFetch('search', {part:'snippet', type:'video', maxResults:max, q, ...(eventType?{eventType}:{}) , ...(videoDuration?{videoDuration}:{}), order: eventType==='live'?'viewCount':'relevance'});
    const ids = s.items.map(i=>i.id.videoId).filter(Boolean).join(',');
    if(!ids) return [];
    const d = await ytFetch('videos', {part:'snippet,statistics,contentDetails', id:ids});
    items = d.items;
  }
  return items.map(v => ({
    id: v.id, title: v.snippet.title, channel: v.snippet.channelTitle,
    thumb: v.snippet.thumbnails.medium?.url || v.snippet.thumbnails.default?.url,
    views: v.statistics ? fmtViews(v.statistics.viewCount) : '',
    rawViews: v.statistics ? v.statistics.viewCount : 0,
    duration: v.contentDetails ? parseDur(v.contentDetails.duration) : '',
    durSec: v.contentDetails ? durSeconds(v.contentDetails.duration) : 999,
    published: timeAgo(v.snippet.publishedAt),
    desc: v.snippet.description || '',
    isLive: v.snippet.liveBroadcastContent === 'live',
    topic: topic || q || 'trending'
  }));
}

function videoCardHTML(v){
  return `<div class="video-card" onclick="openVideo(${JSON.stringify(v).replace(/"/g,'&quot;')})">
    <div class="thumb"><img src="${v.thumb}" loading="lazy" alt="">
      ${v.isLive ? `<div class="live-badge">LIVE</div>` : (v.duration?`<div class="duration-badge">${v.duration}</div>`:'')}
      <div class="thumb-overlay"><div class="play-btn-big"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg></div></div>
    </div>
    <div class="video-meta">
      <div class="channel-pic" style="background:${avatarColor(v.channel)}">${esc((v.channel||'?')[0])}</div>
      <div class="meta-text">
        <div class="video-title">${esc(v.title)}</div>
        <div class="video-channel">${esc(v.channel)}</div>
        <div class="video-stats">${v.isLive ? (v.views?v.views+' watching':'Live now') : (v.views?v.views+' views · ':'')+v.published}</div>
      </div>
    </div>
  </div>`;
}
function shortCardHTML(v){
  return `<div class="short-card" onclick="openVideo(${JSON.stringify(v).replace(/"/g,'&quot;')})">
    <div class="short-thumb"><img src="${v.thumb}" loading="lazy" alt=""><div class="short-badge">Short</div></div>
    <div class="short-title">${esc(v.title)}</div>
    <div class="short-views">${v.views?v.views+' views':''}</div>
  </div>`;
}
function resultRowHTML(v){
  return `<div class="result-row" onclick="openVideo(${JSON.stringify(v).replace(/"/g,'&quot;')})">
    <div class="result-thumb"><img src="${v.thumb}" loading="lazy" alt="">${v.duration?`<div class="duration-badge">${v.duration}</div>`:''}${v.isLive?`<div class="live-badge">LIVE</div>`:''}</div>
    <div class="result-meta">
      <div class="result-title">${esc(v.title)}</div>
      <div class="result-stats">${v.views?v.views+' views · ':''}${v.published}</div>
      <div class="result-channel-row"><div class="channel-pic" style="width:26px;height:26px;font-size:11px;background:${avatarColor(v.channel)}">${esc((v.channel||'?')[0])}</div><span style="color:var(--text2);font-size:13px;">${esc(v.channel)}</span></div>
      <div class="result-desc">${esc(v.desc).slice(0,160)}</div>
    </div>
  </div>`;
}

/* ---------- home rendering ---------- */
async function renderHome(){
  const q = catQuery(activeCategory);
  document.getElementById('liveGrid').innerHTML = `<div class="empty-note">Loading live streams…</div>`;
  document.getElementById('shortsRail').innerHTML = `<div class="empty-note">Loading shorts…</div>`;
  document.getElementById('recGrid').innerHTML = `<div class="empty-note">Loading…</div>`;
  document.getElementById('trendGrid').innerHTML = `<div class="empty-note">Loading trending…</div>`;

  const topic = topTopic();
  const recTitle = document.getElementById('recTitle'), recSub = document.getElementById('recSub');
  if(topic && topic !== 'trending'){
    recTitle.textContent = `Because you watched "${topic}"`;
    recSub.textContent = 'Based on your recent watch history.';
  } else {
    recTitle.textContent = 'Recommended for you';
    recSub.textContent = 'Watch a few videos and this fills in based on what you like.';
  }

  fetchVideos({q: activeCategory==='All' ? 'live news' : q + ' live', eventType:'live', max:8, topic:'live'})
    .then(v => document.getElementById('liveGrid').innerHTML = v.length ? v.map(videoCardHTML).join('') : `<div class="empty-note">No live streams right now for this category.</div>`)
    .catch(()=> document.getElementById('liveGrid').innerHTML = `<div class="empty-note">Couldn't load live streams.</div>`);

  fetchVideos({q: (activeCategory==='All'?'shorts':q+' shorts'), videoDuration:'short', max:10, topic:'shorts'})
    .then(v => { v = v.filter(x=>x.durSec<=90); document.getElementById('shortsRail').innerHTML = v.length ? v.map(shortCardHTML).join('') : `<div class="empty-note">No shorts found.</div>`; })
    .catch(()=> document.getElementById('shortsRail').innerHTML = `<div class="empty-note">Couldn't load shorts.</div>`);

  const recQuery = activeCategory !== 'All' ? q : (topic && topic!=='trending' ? topic : 'trending');
  fetchVideos({q: recQuery, max:12, topic: activeCategory!=='All'?activeCategory:recQuery})
    .then(v => document.getElementById('recGrid').innerHTML = v.length ? v.map(videoCardHTML).join('') : `<div class="empty-note">Nothing found.</div>`)
    .catch(()=> document.getElementById('recGrid').innerHTML = `<div class="empty-note">Couldn't load recommendations.</div>`);

  (activeCategory==='All' ? fetchVideos({chart:true, max:12, topic:'trending'}) : fetchVideos({q, max:12, topic:activeCategory}))
    .then(v => document.getElementById('trendGrid').innerHTML = v.length ? v.map(videoCardHTML).join('') : `<div class="empty-note">Nothing found.</div>`)
    .catch(()=> document.getElementById('trendGrid').innerHTML = `<div class="empty-note">Couldn't load trending videos.</div>`);
}

async function renderLiveView(){
  const grid = document.getElementById('liveGridFull');
  grid.innerHTML = `<div class="empty-note">Loading live streams…</div>`;
  try{
    const v = await fetchVideos({q:'live', eventType:'live', max:20, topic:'live'});
    grid.innerHTML = v.length ? v.map(videoCardHTML).join('') : `<div class="empty-note">No live streams found right now.</div>`;
  }catch(e){ grid.innerHTML = `<div class="empty-note">Couldn't load live streams.</div>`; }
}

function renderHistory(){
  const h = getHistory();
  const list = document.getElementById('historyList');
  list.innerHTML = h.length ? h.map(resultRowHTML).join('') : `<div class="empty-note">No watch history yet. Videos you watch will show up here and power your recommendations.</div>`;
}
document.getElementById('clearHistoryBtn').addEventListener('click', ()=>{ localStorage.removeItem('vt_history'); renderHistory(); renderHome(); });

/* ---------- search ---------- */
function showSkeletonsSearch(){
  document.getElementById('searchList').innerHTML = Array.from({length:6},()=>`
    <div class="result-row" style="pointer-events:none;">
      <div class="result-thumb skel"></div>
      <div class="result-meta">
        <div class="skel" style="width:75%;height:18px;margin-bottom:10px;"></div>
        <div class="skel" style="width:35%;height:13px;margin-bottom:10px;"></div>
        <div class="skel" style="width:90%;height:13px;"></div>
      </div>
    </div>`).join('');
}
async function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  if(!q){ switchView('home'); return; }
  switchView('search');
  document.getElementById('searchTitle').textContent = `Results for "${q}"`;
  showSkeletonsSearch();
  try{
    const v = await fetchVideos({q, max:24, topic:q});
    document.getElementById('searchList').innerHTML = v.length ? v.map(resultRowHTML).join('') : `<div class="empty-note">No results for "${esc(q)}". Try different keywords.</div>`;
  }catch(e){
    document.getElementById('searchList').innerHTML = `<div class="empty-note">Something went wrong: ${esc(e.message)}</div>`;
  }
}

/* ---------- view switching ---------- */
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('shortsFeed').classList.remove('active');
  document.querySelectorAll('.nav-item[data-view]').forEach(n=>n.classList.toggle('active', n.dataset.view===name));
  if(name==='shorts'){
    document.getElementById('shortsFeed').classList.add('active');
    loadShortsFeed();
    return;
  }
  const el = document.getElementById('view-'+name);
  if(el) el.classList.add('active');
  if(name==='home') renderHome();
  if(name==='live') renderLiveView();
  if(name==='history') renderHistory();
}

/* ---------- shorts full feed ---------- */
let shortsObserver=null, shortsLoading=false;
async function loadShortsFeed(){
  const feed = document.getElementById('shortsFeed');
  if(feed.dataset.loaded) return;
  feed.dataset.loaded='1';
  feed.innerHTML = `<div class="shorts-feed-empty">Loading shorts…</div>`;
  try{
    let v = await fetchVideos({q:'shorts', videoDuration:'short', max:15, topic:'shorts'});
    v = v.filter(x=>x.durSec<=90);
    if(!v.length){ feed.innerHTML = `<div class="shorts-feed-empty">No shorts found.</div>`; return; }
    feed.innerHTML = v.map(shortSlideHTML).join('');
    setupShortsObserver();
  }catch(e){ feed.innerHTML = `<div class="shorts-feed-empty">Couldn't load shorts.</div>`; }
}
function shortSlideHTML(v){
  return `<div class="short-slide" data-id="${v.id}">
    <div class="short-player-wrap" data-video-id="${v.id}"></div>
    <div class="short-info"><div class="st">${esc(v.title)}</div><div class="sc">${esc(v.channel)} · ${v.views||''} views</div></div>
    <div class="short-side-actions">
      <button title="Like"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/></svg></button>
      <button title="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></button>
    </div>
  </div>`;
}
function setupShortsObserver(){
  const slides = document.querySelectorAll('.short-slide');
  if(shortsObserver) shortsObserver.disconnect();
  shortsObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry => {
      const wrap = entry.target.querySelector('.short-player-wrap');
      const vid = wrap.dataset.videoId;
      if(entry.isIntersecting && entry.intersectionRatio > 0.6){
        if(!wrap.dataset.built){
          wrap.dataset.built='1';
          wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&loop=1&playlist=${vid}&controls=0&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
          pushHistory({id:vid, title: entry.target.querySelector('.st').textContent, channel: entry.target.querySelector('.sc').textContent.split(' · ')[0], thumb:''}, 'shorts');
        }
      }
    });
  }, {root: document.getElementById('shortsFeed'), threshold:[0,0.6]});
  slides.forEach(s=>shortsObserver.observe(s));
}

/* ---------- video modal / player ---------- */
function onYouTubeIframeAPIReady(){ /* player created on demand */ }

async function openVideo(v){
  currentVideoId = v.id; isSubscribed=false; isLiked=false;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
  document.getElementById('playerVideo').innerHTML = `<div id="ytPlayerTarget" style="width:100%;height:100%;"></div>`;
  document.getElementById('playerTitle').textContent = v.title;
  document.getElementById('playerStats').textContent = (v.views?v.views+' views · ':'')+(v.isLive?'Live now':v.published);
  document.getElementById('playerChannelPic').style.background = avatarColor(v.channel);
  document.getElementById('playerChannelPic').textContent = (v.channel||'?')[0];
  document.getElementById('playerChannelName').textContent = v.channel;
  document.getElementById('subBtn').textContent='Subscribe'; document.getElementById('subBtn').classList.remove('subscribed');
  document.getElementById('likeBtn').classList.remove('liked');
  document.getElementById('descBox').textContent = v.desc || 'No description available.';

  pushHistory({id:v.id,title:v.title,channel:v.channel,thumb:v.thumb,views:v.views,published:v.published,duration:v.duration,isLive:v.isLive,desc:v.desc}, v.topic || activeCategory);

  ytPlayer = new YT.Player('ytPlayerTarget', {
    videoId: v.id,
    playerVars: {autoplay:1, rel:0, playsinline:1},
    events: { onStateChange: onPlayerStateChange }
  });

  // build up-next queue from related topic
  try{
    const related = await fetchVideos({q: v.topic && v.topic!=='trending' ? v.topic : v.title.split(' ').slice(0,3).join(' '), max:10, topic:v.topic});
    upNextQueue = related.filter(r=>r.id!==v.id);
    renderUpNext();
  }catch(e){ document.getElementById('upNextList').innerHTML=''; }
}
function onPlayerStateChange(e){
  if(e.data === YT.PlayerState.ENDED && autoplayOn && upNextQueue.length){
    openVideo(upNextQueue[0]);
  }
}
function renderUpNext(){
  document.getElementById('upNextList').innerHTML = upNextQueue.map(u=>`
    <div class="up-next-card" onclick='openVideo(${JSON.stringify(u).replace(/'/g,"&#39;")})'>
      <div class="up-next-thumb"><img src="${u.thumb}" loading="lazy" alt="">${u.isLive?`<div class="live-badge" style="font-size:9px;padding:2px 5px;">LIVE</div>`:(u.duration?`<div class="duration-badge" style="font-size:10px;padding:1px 5px;">${u.duration}</div>`:'')}</div>
      <div class="up-next-meta">
        <div class="up-next-title-text">${esc(u.title)}</div>
        <div class="up-next-channel">${esc(u.channel)}</div>
        <div class="up-next-stats">${u.views?u.views+' views':''}</div>
      </div>
    </div>`).join('');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
  if(ytPlayer && ytPlayer.destroy){ try{ ytPlayer.destroy(); }catch(e){} }
  ytPlayer=null;
  document.getElementById('playerVideo').innerHTML='';
}
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => { if(e.target===document.getElementById('modal')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
document.getElementById('subBtn').addEventListener('click', function(){ isSubscribed=!isSubscribed; this.textContent=isSubscribed?'Subscribed':'Subscribe'; this.classList.toggle('subscribed',isSubscribed); });
document.getElementById('likeBtn').addEventListener('click', function(){ isLiked=!isLiked; this.classList.toggle('liked',isLiked); });
document.getElementById('autoplaySwitch').addEventListener('click', function(){ autoplayOn=!autoplayOn; this.classList.toggle('on',autoplayOn); });

/* ---------- nav wiring ---------- */
document.querySelectorAll('.nav-item[data-view]').forEach(btn=>{
  btn.addEventListener('click', ()=> switchView(btn.dataset.view));
});
document.querySelectorAll('.chip-nav').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    switchView('home');
    const cat = btn.dataset.cat;
    const match = [...document.querySelectorAll('.chip')].find(c=>c.dataset.cat===cat);
    if(match) setChip(match);
  });
});
document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=> setChip(chip));
});
function setChip(el){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  activeCategory = el.dataset.cat;
  switchView('home');
}
document.getElementById('logoLink').addEventListener('click', e=>{ e.preventDefault(); document.getElementById('searchInput').value=''; switchView('home'); });
document.getElementById('searchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
document.getElementById('searchBtn').addEventListener('click', doSearch);
document.getElementById('hamburgerBtn').addEventListener('click', ()=>{
  sidebarCollapsed=!sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', sidebarCollapsed);
  document.getElementById('main').classList.toggle('sidebar-collapsed', sidebarCollapsed);
  document.getElementById('shortsFeed').style.left = sidebarCollapsed ? '76px' : 'var(--sidebar-w)';
});

renderHome();
</script>
